name: Qualidade Projeto B
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: catalogo_test
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: catalogo_gt4_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalogo_test -d catalogo_gt4_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Configurar banco descartável
        run: |
          cat > .env.test <<'ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=catalogo_test
          DB_PASSWORD=ci_ephemeral_test_only
          DB_NAME=catalogo_gt4_test
          JWT_SECRET=ci_ephemeral_jwt_for_tests_only
          JWT_EXPIRES_IN=1h
          ENV
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
